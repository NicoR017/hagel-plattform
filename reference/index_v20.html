<style>
  :root{
    --navy:#16233f; --green:#86b08a; --greenDk:#5e8c63; --greenBg:#e4eee5;
    --grey:#cfd6df; --greyDk:#aab3c0; --line:#e6e9ee; --text:#16233f;
    --sub:#6b7585; --brick:#a23b2e; --bg:#f4f6f9; --warn:#e7b94b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--navy);}
  body{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--text);}
  #app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;}
  input,select,button,textarea{font-family:inherit;}
  button{cursor:pointer;}
  .hdr{background:var(--navy);padding:max(14px,env(safe-area-inset-top)) 16px 26px;color:#fff;}
  .hdr .top{display:flex;justify-content:space-between;align-items:center;}
  .hdr h1{margin:12px 0 0;font-size:24px;font-weight:800;}
  .hdr .sub{color:#cdd6e6;margin-top:4px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .iconbtn{width:40px;height:40px;border-radius:50%;background:#3a4a6b;border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .sheet{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-14px;padding:18px 14px;min-height:70vh;}
  .body{background:#fff;border-radius:18px 18px 0 0;margin-top:-12px;min-height:72vh;padding-bottom:90px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:14px;color:var(--sub);margin-bottom:7px;}
  .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;color:var(--text);outline:none;}
  .chip{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;font-weight:500;}
  .chip.on{border-color:var(--greenDk);background:var(--greenBg);color:var(--greenDk);font-weight:700;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .toggle{width:50px;height:28px;border-radius:16px;border:none;background:var(--grey);position:relative;flex:0 0 auto;}
  .toggle.on{background:var(--greenDk);}
  .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on .knob{left:25px;}
  .pbtn{width:100%;margin-top:18px;padding:15px;background:var(--navy);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;}
  .card{background:#fff;border-radius:16px;box-shadow:0 1px 6px rgba(20,35,63,.06);overflow:hidden;}
  .summary{background:var(--navy);border-radius:14px;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:10px 0 14px;}
  .panelcard{border-left:5px solid var(--green);background:#fff;border-radius:0 12px 12px 0;box-shadow:0 1px 4px rgba(20,35,63,.07);padding:12px 14px;margin-bottom:10px;}
  .badge{background:var(--navy);color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--navy);display:flex;justify-content:space-around;padding:10px 0 max(14px,env(safe-area-inset-bottom));border-radius:16px 16px 0 0;z-index:20;}
  .tab{background:transparent;border:none;border-radius:12px;padding:9px 16px;color:#8a97b3;position:relative;font-size:20px;}
  .tab.on{background:#fff;color:var(--navy);}
  .tab .bdg{position:absolute;top:2px;right:8px;background:var(--green);color:var(--navy);font-size:10px;font-weight:800;border-radius:8px;padding:0 5px;}
  .fab{position:fixed;bottom:24px;right:calc(50% - 240px + 18px);width:60px;height:60px;border-radius:18px;background:var(--navy);border:none;color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(20,35,63,.35);z-index:20;}
  @media(max-width:520px){.fab{right:18px;}}
  .overlay{position:fixed;inset:0;background:rgba(10,18,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.center{align-items:center;padding:20px;}
  .dialog{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;max-height:94vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
  .modalbox{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px;}
  .seg{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700;font-size:13px;text-align:center;}
  .seg.on{border-color:var(--navy);background:var(--navy);color:#fff;}
  .mini{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{padding:8px 6px;text-align:center;font-size:12px;font-weight:700;background:#0a3a8c;color:#fff;}
  td{padding:8px 6px;border-bottom:1px solid var(--line);}
  .muted{color:var(--sub);}
  .imgcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;}
  .imgcard .ph{position:relative;aspect-ratio:4/3;background:var(--bg);}
  .imgcard img{width:100%;height:100%;object-fit:cover;display:block;}
  .delbtn{position:absolute;top:6px;right:6px;background:rgba(20,35,63,.8);border:none;border-radius:50%;width:28px;height:28px;color:#fff;font-size:14px;}
  .hidden{display:none;}
  .kpick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text);}
  .kitem{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .kitem .kmain{flex:1;min-width:0;}
  .kitem .kname{font-size:16px;font-weight:700;}
  .kitem .kmail{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kitem.sel{background:var(--greenBg);border-radius:10px;}
  .toastbox{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:90vw;text-align:center;box-shadow:0 6px 18px rgba(20,35,63,.35);}
</style>

function fileToB64(file,max,q){return new Promise(resolve=>{
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      resolve(cv.toDataURL("image/jpeg",q).split(",")[1]);
    };
    img.src=fr.result;};
  fr.readAsDataURL(file);});}

async function aiRead(file,mode,land){
  const key=(S.settings.aiKey||"").trim();

  const res=await fetch(AI_URL,{method:"POST",
    headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json",
      "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:(S.settings.aiModel||AI_MODEL_DEF),max_tokens:300,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:aiPrompt(mode,land)}]}]})});
  const j=await res.json().catch(()=>null);
  if(!j)throw new Error("Keine Antwort vom Server.");
  if(j.error)throw new Error((j.error.message||"API-Fehler")+" ["+(j.error.type||"")+"]");
  const txt=((j.content||[]).map(c=>c.text||"").join("")||"").replace(/```json|```/g,"").trim();
  let out; try{ out=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1)); }
  catch(e){ throw new Error("Antwort nicht lesbar: "+txt.slice(0,80)); }
  let val=String(out.wert||"").toUpperCase().trim();
  if(mode==="fin")val=val.replace(/[^A-Z0-9]/g,"").replace(/O/g,"0").replace(/Q/g,"0").replace(/I/g,"1");
  return {wert:val,sicher:out.sicher||"mittel",hinweis:out.hinweis||""};
}

const TESS_URL="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
function loadScript(src){return new Promise((res,rej)=>{
  const el=document.createElement("script"); el.src=src;
  el.onload=()=>res(); el.onerror=()=>rej(new Error("Texterkennung konnte nicht geladen werden \u2013 einmalig Internet n\u00f6tig."));
  document.head.appendChild(el);});}
function prepImage(file,maxW){maxW=maxW||1600;
  return new Promise(resolve=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxW/img.width), w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        const cx=cv.getContext("2d"); cx.drawImage(img,0,0,w,h);
        const d=cx.getImageData(0,0,w,h), a=d.data;
        let mn=255,mx=0;
        for(let i=0;i<a.length;i+=4){const g=(a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)|0; a[i]=a[i+1]=a[i+2]=g; if(g<mn)mn=g; if(g>mx)mx=g;}
        const rng=Math.max(1,mx-mn);
        for(let i=0;i<a.length;i+=4){const g=Math.max(0,Math.min(255,((a[i]-mn)*255/rng)|0)); a[i]=a[i+1]=a[i+2]=g;}
        cx.putImageData(d,0,0);
        resolve(cv.toDataURL("image/jpeg",0.92));
      };
      img.src=fr.result;};
    fr.readAsDataURL(file);});}
async function ocrText(file,onProg){
  if(!window.Tesseract)await loadScript(TESS_URL);
  const src=await prepImage(file);
  const r=await window.Tesseract.recognize(src,"eng",{logger:m=>{
    if(onProg){ if(m.status==="loading language traineddata")onProg("Sprachdaten laden \u2026");
      else if(m.status==="recognizing text")onProg("Erkenne Text \u2026 "+Math.round((m.progress||0)*100)+" %"); }}});
  return (r&&r.data&&r.data.text)||"";
}
function findVIN(txt){
  const raw=String(txt).toUpperCase()
    .replace(/\b(VIN|FIN|CHASSIS|CHASIS|BASTIDOR|FAHRGESTELLNUMMER|FAHRGESTELLNR|FGNR|NR|NO)\b\.?/g," ");
  const cand=[];
  raw.split(/[\r\n]+/).forEach(line=>{
    const cl=line.replace(/[^A-Z0-9]/g,"").replace(/O/g,"0").replace(/Q/g,"0").replace(/I/g,"1");
    const re=/[A-HJ-NPR-Z0-9]{17}/g; let m;
    while((m=re.exec(cl)))cand.push(m[0]);
  });
  if(!cand.length){
    const all=raw.replace(/[^A-Z0-9]/g,"").replace(/O/g,"0").replace(/Q/g,"0").replace(/I/g,"1");
    const re=/[A-HJ-NPR-Z0-9]{17}/g; let m;
    while((m=re.exec(all)))cand.push(m[0]);
  }
  cand.sort((a,b)=>(/^[A-Z]{2,3}/.test(b)?1:0)-(/^[A-Z]{2,3}/.test(a)?1:0));
  return cand[0]||"";
}
function findPlate(txt){
  const raw=String(txt).toUpperCase().replace(/[|]/g,"I");
  let m=/\b(\d{4})\s*[- ]?\s*([BCDFGHJKLMNPRSTVWXYZ]{3})\b/.exec(raw);   // ES
  if(m)return m[1]+" "+m[2];
  m=/\b([A-Z\u00c4\u00d6\u00dc]{1,3})\s*[-\u00b7. ]\s*([A-Z]{1,2})\s*[ -]?\s*(\d{1,4})\b/.exec(raw); // DE
  if(m)return m[1]+"-"+m[2]+" "+m[3];
  return "";
}

function bin2str(u8){let s="";const CH=0x8000;for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return s;}
async function inflateAny(bytes){
  for(const fmt of ["deflate","deflate-raw"]){
    try{const ds=new DecompressionStream(fmt);
      const st=new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(st).arrayBuffer());}catch(e){}
  }
  return null;
}
async function colibriPages(buf){
  const u8=new Uint8Array(buf), s=bin2str(u8), pages=[];
  const re=/[^d]stream\r?\n/g; let m;
  while((m=re.exec(s))){
    const st=m.index+m[0].length; let en=s.indexOf("endstream",st);
    if(en<0)continue;
    while(en>st&&(u8[en-1]===10||u8[en-1]===13||u8[en-1]===32))en--;
    const inf=await inflateAny(u8.subarray(st,en)); if(!inf)continue;
    const txt=bin2str(inf);
    if(txt.indexOf(" Tm")<0||txt.indexOf("Tj")<0)continue;
    const items=[], tre=/1 0 0 1 (-?[\d.]+) (-?[\d.]+) Tm\s*<([0-9A-Fa-f]+)>\s*Tj/g; let t;
    while((t=tre.exec(txt))){
      const hex=t[3]; let out="";
      for(let i=0;i+4<=hex.length;i+=4)out+=String.fromCharCode(parseInt(hex.substr(i,4),16));
      const val=out.replace(/\s+/g," ").trim();
      if(val)items.push({x:parseFloat(t[1]),y:parseFloat(t[2]),s:val});
    }
    if(items.length)pages.push(items);
  }
  return pages;
}

const HEADKEYS={kennzeichen:["nummernschild","kennzeichen","amtliches kennzeichen","license plate","licence plate","plate","number plate","registration","matricula","plaque","immatriculation","targa","matricola","kenteken"],

  sprache:["language","sprache","idioma","langue","lingua"]};
const HEAD={}; Object.keys(HEADKEYS).forEach(k=>HEADKEYS[k].forEach(w=>HEAD[w]=k));
const TOTALW=["total","gesamt","summe","totale","totaal","soma"];
function parseColibri(pages){
  const out={panels:{},head:{},found:0,unknown:[],rowSum:0,reportTotal:null};
  pages.forEach(items=>{
    // Kopfdaten: Label, darunter der Wert an derselben x-Position (kein anderes Label)
    items.forEach(it=>{
      const k=HEAD[normComp(it.s)]; if(!k||out.head[k])return;
      let best=null;
      items.forEach(o=>{ if(o===it||Math.abs(o.x-it.x)>4)return; if(o.y>=it.y||it.y-o.y>26)return;
        if(!best||o.y>best.y)best=o; });
      if(best&&!HEAD[normComp(best.s)])out.head[k]=best.s;
    });
    // Gesamtzahl laut Bericht ("All: 503 Ø: 30mm" / "Alle: …" / "Todos: …")
    items.forEach(it=>{const m=/^[^\d:]{2,14}:\s*(\d+)\s*[ØΦ∅ø]/.exec(it.s); if(m&&out.reportTotal==null)out.reportTotal=+m[1];});
    // Spaltenraster
    const cols={}; let totX=null;
    items.forEach(it=>{const z=it.s.replace(/\s/g,"").toLowerCase(); const m=/^(10|20|30|40|50|60|70|80|100)mm$/.exec(z);
      if(m)cols[+m[1]]=it.x; else if(TOTALW.includes(normComp(it.s)))totX=it.x;});
    if(!Object.keys(cols).length)return;
    const minCol=Math.min.apply(null,Object.values(cols));
    const rows={};
    items.forEach(it=>{const k=Math.round(it.y); (rows[k]=rows[k]||[]).push(it);});
    Object.keys(rows).forEach(k=>{
      const grp=rows[k];
      const name=grp.filter(i=>i.x<minCol-8).sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").trim();
      if(!name)return;
      const nums=grp.filter(i=>i.x>=minCol-8&&/^\d+$/.test(i.s));
      const dents={}; let big=0, any=false, sum=0;
      SIZES_IMP.forEach(sz=>{
        const cx=cols[sz]; if(cx==null)return;
        const cell=nums.find(i=>Math.abs(i.x-cx)<7); if(!cell)return;
        const n=parseInt(cell.s,10); if(!n)return;

      });
      if(!any)return;
      out.rowSum+=sum;
      const key=colibriKey(name);
      if(!key){out.unknown.push(name+" ("+sum+")");return;}
      out.found++;
      const prev=out.panels[key]||{dents:{},big:0};
      SIZES.forEach(sz=>{if(dents[sz])prev.dents[sz]=(prev.dents[sz]||0)+dents[sz];});
      prev.big+=big;
      out.panels[key]=prev;
    });
  });
  out.imported=Object.values(out.panels).reduce((a,p)=>a+Object.values(p.dents).reduce((x,y)=>x+y,0)+(p.big||0),0);
  return out;
}

function getDents(p){ if(p&&p.dents)return p.dents; if(p&&p.count)return {[p.size||20]:p.count}; return {}; }
function dentBreak(p){
  const d=getDents(p); const parts=SIZES.filter(s=>d[s]).map(s=>d[s]+"\u00d7"+s);
  return parts.length>1?parts.join("  \u00b7  ")+" mm":"";
}
function panelStats(p){
  const d=getDents(p); let total=0,w=0;
  SIZES.forEach(s=>{const n=d[s]||0; total+=n; w+=s*n;});
  const avgX=total?w/total:0;
  const avgClass=total?Math.min(80,Math.max(10,Math.ceil(avgX/10)*10)):0;
  return {total,avgX,avgClass};
}
function lookupAW(teiler,orient,count,sizeClass){
  const tbl=AW_TABLE[String(teiler)][orient];
  const idx=SIZES.indexOf(sizeClass); if(idx<0||count<=0)return 0;
  const keys=Object.keys(tbl).map(Number).sort((a,b)=>a-b);
  const val=k=>{const r=tbl[String(k)];return idx<r.length?r[idx]:r[r.length-1];};
  if(count<=keys[0])return val(keys[0]);
  if(count>=keys[keys.length-1])return val(keys[keys.length-1]);
  let lo=keys[0],hi=keys[keys.length-1];
  for(const k of keys)if(k<=count)lo=k;
  for(let i=keys.length-1;i>=0;i--)if(keys[i]>=count)hi=keys[i];
  if(lo===hi)return val(lo);
  const vl=val(lo),vh=val(hi);
  return Math.round(vl+(vh-vl)*(count-lo)/(hi-lo));
}

function computeES(v,s){
  const rate=+s.stundensatz||0;
  const panels=Object.values(v.panels||{}).map(p=>{
    const st=panelStats(p); return Object.assign({},p,st,panelBollos(p),{repair:0});
  }).filter(p=>p.total>0||(p.big||0)>0);
  const small=panels.reduce((a,p)=>a+p.small,0), large=panels.reduce((a,p)=>a+p.large,0), bollos=small+2*large;
  const cat=esCat(bollos), H=esHours(bollos);
  const adj=[];
  const ren=panels.filter(p=>p.method==="erneuern");
  ren.forEach(p=>adj.push({de:(p.key==="haube"?"Motorhaube ersetzt":"Ersetzt/Lackierung: "+PMAP[p.key].label),
    es:(p.key==="haube"?"Capó sustituido":"Pieza sustituida / a pintura: "+(PMAP[p.key].es||PMAP[p.key].label)),h:-1}));
  /* Push to Paint: Anteil des Bauteils am Matrixpreis (nach Bollos) −40 % */
  /* Klebetechnik: Anteil des Bauteils am Matrixpreis (nach Bollos) +30 % (wie DE) */
  panels.filter(p=>p.kleber&&p.method!=="erneuern"&&p.bollos>0&&bollos>0).forEach(p=>{
    const h=Math.round(H.h*p.bollos/bollos*0.30*100)/100;
    if(h>0)adj.push({de:"Klebetechnik (+30 %): "+PMAP[p.key].label,
      es:"Técnica de adhesivo (+30 %): "+(PMAP[p.key].es||PMAP[p.key].label),h,kleber:true,key:p.key});});
  panels.filter(p=>p.method==="ptp"&&p.bollos>0&&bollos>0).forEach(p=>{
    const h=-Math.round(H.h*p.bollos/bollos*(p.kleber?1.30:1)*0.40*100)/100;
    if(h<0)adj.push({de:"Vordrücken zur Lackierung (−40 %): "+PMAP[p.key].label,
      es:"Desabollado previo a pintura (Push to Paint, −40 %): "+(PMAP[p.key].es||PMAP[p.key].label),h,ptp:true,key:p.key});});
  if(panels.some(p=>p.alu&&p.method!=="erneuern"))adj.push({de:"Aluminiumteile",es:"Piezas de aluminio",h:1});
  const adjH=adj.reduce((a,x)=>a+x.h,0);
  const totH=bollos>0?Math.max(0,H.h+adjH):0;
  const matrixEur=H.h*rate, awNetto=totH*rate;
  const demEur=v.demontage?Math.max(0,+(v.demontageEur!=null?v.demontageEur:150)||0):0;
  const netto=awNetto+demEur, vat=vatOf(v);
  const dents=panels.reduce((a,p)=>a+p.total,0)+panels.reduce((a,p)=>a+(+p.big||0),0);
  const avg=dents?Math.round(panels.reduce((a,p)=>a+p.avgX*p.total,0)/Math.max(1,panels.reduce((a,p)=>a+p.total,0))):0;
  return {es:{small,large,bollos,cat,H,adj,adjH,totH,rate,matrixEur,cap:cat[3]*rate,kb:bollos>0?esKickback(H.h):0},
    panels,repairAW:H.h,finishAW:0,ruestAW:0,greifAW:0,hohlAW:0,verbrAW:0,totalAW:totH,awNetto,
    repairEur:matrixEur,kleberMat:0,hohlMat:0,bigCount:panels.reduce((a,p)=>a+(+p.big||0),0),bigEur:0,demEur,netto,brutto:netto*(1+vat),vat,
    euroPerAW:rate,dents,avg,panelCount:panels.length,kleberN:0};
}

function esFormula(e,lang){

function computeDE(v,s){
  const t=teilerVals(s.teiler), euroPerAW=s.stundensatz/s.teiler;
  const panels=Object.values(v.panels||{}).map(p=>{
    const st=panelStats(p); return Object.assign({},p,st,{repair:panelRepairAW(p,s.teiler)});
  }).filter(p=>p.total>0||(p.big||0)>0);
  const repairAW=panels.reduce((a,p)=>a+p.repair,0);
  const finishN=panels.filter(p=>p.finish&&p.method!=="erneuern"&&p.total>0).length;
  const finishAW=Math.min(t.finishPer*finishN,t.finishCap);

  const greifAW=v.greifzone?t.greif:0, hohlAW=v.hohlraum?t.hohl:0, verbrAW=v.verbringung?t.verbr:0;
  const totalAW=repairAW+finishAW+ruestAW+greifAW+hohlAW+verbrAW;
  const awNetto=totalAW*euroPerAW;
  const kleberN=panels.filter(p=>p.kleber).length;

  const hohlMat=v.hohlraum?15:0;
  const bigCount=panels.reduce((a,p)=>a+(p.big||0),0);

  const demEur=v.demontage?Math.max(0,+(v.demontageEur!=null?v.demontageEur:150)||0):0;
  const netto=awNetto+kleberMat+hohlMat+bigEur+demEur;
  const dents=panels.reduce((a,p)=>a+p.total,0);
  const avg=dents?Math.round(panels.reduce((a,p)=>a+p.avgX*p.total,0)/dents):0;
  const vat=vatOf(v);
  return {panels,repairAW,finishAW,ruestAW,greifAW,hohlAW,verbrAW,totalAW,awNetto,
    repairEur:repairAW*euroPerAW,kleberMat,hohlMat,bigCount,bigEur,demEur,netto,brutto:netto*(1+vat),vat,
    euroPerAW,dents,avg,panelCount:panels.length,kleberN};

  for(let p=0;p<nP;p++){const cObj=base+p*2,pObj=base+1+p*2,content=pages[p];
    objs[cObj]="<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream";
    objs[pObj]="<< /Type /Page /Parent 2 0 R /Contents "+cObj+" 0 R >>"; kids.push(pObj+" 0 R");}
  const xobj=imgObjs.length?" /XObject << "+imgObjs.map((o,k)=>"/"+o.name+" "+(imgBase+k)+" 0 R").join(" ")+" >>":"";
  objs[2]="<< /Type /Pages /Count "+nP+" /Kids ["+kids.join(" ")+"] /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>"+xobj+" >> >>";
  const maxObj=base+nP*2-1; let out="%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n"; const off=[];
  for(let i=1;i<=maxObj;i++){off[i]=out.length; out+=i+" 0 obj\n"+objs[i]+"\nendobj\n";}
  const xref=out.length;
  out+="xref\n0 "+(maxObj+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<=maxObj;i++)out+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  out+="trailer\n<< /Size "+(maxObj+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  const bytes=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&0xff;
  return bytes;
}
/* ===== Eine PDF: Kalkulation + Colibri-Scanbericht ===== */
const SEND_READY={}; let PDFLIB_P=null;
function loadPdfLib(){ if(window.PDFLib)return Promise.resolve(); if(!PDFLIB_P)PDFLIB_P=loadScript("pdf-lib.min.js").catch(e=>{PDFLIB_P=null;throw e;}); return PDFLIB_P; }
async function buildSendPDF(v,c){
  const kva=generateKalkPDF(v,c);
  const sc=v.colibriFile?await loadScan(v):null;
  if(!sc)return {bytes:kva,merged:false,scan:null};
  try{
    await loadPdfLib();
    const D=PDFLib.PDFDocument;
    const out=await D.load(kva);
    const src=await D.load(sc.bytes.slice?sc.bytes.slice(0):sc.bytes,{ignoreEncryption:true});
    const pgs=await out.copyPages(src,src.getPageIndices()); pgs.forEach(pg=>out.addPage(pg));
    out.setTitle((vLand(v)==="ES"?"Presupuesto + informe Colibri ":"Kostenvoranschlag + Colibri-Scan ")+(v.kennzeichen||""));
    return {bytes:await out.save(),merged:true,scan:sc};
  }catch(e){ console.warn("Zusammenführen fehlgeschlagen:",e); return {bytes:kva,merged:false,scan:sc,err:e.message}; }
}
function prepSendPDF(v,c){ SEND_READY[v.id]=null; buildSendPDF(v,c).then(r=>{SEND_READY[v.id]=r;}).catch(e=>{SEND_READY[v.id]={err:e.message};}); }
async function sharePDF(v,c){
  const r=SEND_READY[v.id];
  if(!r||!r.bytes){ if(!r)alert("PDF wird noch vorbereitet – bitte gleich nochmal tippen."); else alert("PDF konnte nicht erstellt werden: "+r.err); return; }
  const bytes=r.bytes;
  const blob=new Blob([bytes],{type:"application/pdf"});
  const fname=kvaFileName(v);
  try{
    const file=new File([blob],fname,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Hagel-Kalkulation",text:"Kalkulationsblatt "+(v.kennzeichen||"")});
      return;
    }

  const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

/* Öffnet das Teilen-Menü (Outlook auswählen) mit PDF im Anhang; E-Mail-Adresse liegt in der Zwischenablage. */
async function mailPDF(v,c){
  const r=SEND_READY[v.id];
  if(!r||!r.bytes){ if(!r)alert("PDF wird noch vorbereitet – bitte gleich nochmal tippen."); else alert("PDF konnte nicht erstellt werden: "+r.err); return; }
  const fname=kvaFileName(v);
  const blob=new Blob([r.bytes],{type:"application/pdf"});
  const file=new File([blob],fname,{type:"application/pdf"});
  const files=[file];
  // nur falls Zusammenführen nicht ging: Scan wie bisher separat anhängen
  const sc=(!r.merged&&r.scan)?r.scan:null;
  if(sc)files.push(new File([sc.bytes],sc.name,{type:"application/pdf"}));
  const k=custByName(v.kunde); if(k){k.lastUsed=Date.now(); if(k.email)v.kundeEmail=k.email; sortCustomers(); persist();}
  const mt=mailTexts(v), to=(v.kundeEmail||"").trim();
  // Adresse vorab in die Zwischenablage (nicht abwarten, damit das Teilen-Menü sofort aufgeht)
  if(to&&navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(to).catch(()=>{});}catch(e){}}
  if(navigator.canShare&&navigator.canShare({files})){
    if(to)toast("📋 "+to+" ist kopiert – in Outlook bei „An“ einfügen.",6000);
    else toast("Keine E-Mail beim Kunden hinterlegt – Empfänger in Outlook eintragen.",5000);
    try{await navigator.share({files,title:mt.subject,text:mt.body});}
    catch(e){ if(e&&e.name!=="AbortError")alert("Teilen nicht möglich: "+e.message); }
    return;
  }
  // Fallback (z. B. Laptop ohne Teilen-Funktion): PDF speichern + Mailprogramm mit Adresse/Betreff öffnen
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  if(sc){const u2=URL.createObjectURL(new Blob([sc.bytes],{type:"application/pdf"})); setTimeout(()=>{const a2=document.createElement("a"); a2.href=u2; a2.download=sc.name; document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(()=>URL.revokeObjectURL(u2),5000);},300);}
  toast("PDF wurde gespeichert – bitte in der Mail als Anhang hinzufügen.",6000);
  setTimeout(()=>{location.href="mailto:"+encodeURIComponent(to).replace(/%40/g,"@")+"?subject="+encodeURIComponent(mt.subject)+"&body="+encodeURIComponent(mt.body);},600);
}

/* ===== Speicher: IndexedDB (offline) ===== */
let DB=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("hes_hagel",1);
  r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv"); if(!db.objectStoreNames.contains("img"))db.createObjectStore("img");};
  r.onsuccess=()=>{DB=r.result;res(DB);}; r.onerror=()=>rej(r.error);
});}
function tx(store,mode){return DB.transaction(store,mode).objectStore(store);}
function kvGet(k){return new Promise(res=>{try{const rq=tx("kv","readonly").get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined);}catch(e){res(undefined);}});}
function kvDel(k){return new Promise(res=>{try{const rq=tx("kv","readwrite").delete(k);rq.onsuccess=()=>res();rq.onerror=()=>res();}catch(e){res();}});}
const SCAN_CACHE={};
const APP_VERSION="v20";
/* ===== Datensicherung: alles in eine Datei / aus einer Datei ===== */
function kvKeys(){return new Promise(res=>{try{const rq=tx("kv","readonly").getAllKeys();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);}catch(e){res([]);}});}
function ab2b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function b642ab(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
async function exportBackup(withScans){
  const data={app:"hes-hagel",version:APP_VERSION,created:new Date().toISOString(),
    vehicles:S.vehicles,customers:S.customers,settings:Object.assign({},S.settings,{aiKey:undefined}),images:{},scans:{}};
  S.vehicles.forEach(v=>(v.images||[]).forEach(im=>{if(S.images[im.id])data.images[im.id]=S.images[im.id];}));
  if(withScans){for(const v of S.vehicles){if(!v.colibriFile)continue; const sc=await loadScan(v); if(sc&&sc.bytes)data.scans[v.id]={name:sc.name,b64:ab2b64(sc.bytes)};}}
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const d=new Date(), stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
  const name="Hagel-Sicherung_"+stamp+".json";
  const file=new File([blob],name,{type:"application/json"});
  S.settings.lastBackup=Date.now(); persist();
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;} }
  catch(e){ if(e&&e.name==="AbortError")return; }
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function importBackup(f){
  let d; try{d=JSON.parse(await f.text());}catch(e){alert("Datei ist keine gültige Sicherung.");return;}
  if(!d||d.app!=="hes-hagel"||!Array.isArray(d.vehicles)){alert("Datei ist keine Sicherung dieser App.");return;}
  const have=new Set(S.vehicles.map(v=>v.id)); let nNew=0, nUpd=0;
  for(const v of d.vehicles){
    const i=S.vehicles.findIndex(x=>x.id===v.id);
    if(i<0){S.vehicles.push(v);nNew++;} else {S.vehicles[i]=v;nUpd++;}
    for(const im of (v.images||[])){const u=d.images&&d.images[im.id]; if(u){S.images[im.id]=u; await imgSet(im.id,u);}}
    const sc=d.scans&&d.scans[v.id]; if(sc){const rec={name:sc.name,bytes:b642ab(sc.b64)}; await kvSet("scan_"+v.id,rec); SCAN_CACHE[v.id]=rec;}
  }
  S.vehicles.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  (d.customers||[]).forEach(k=>upsertCustomer(k.name,k.email,k.adresse));
  const keepKey=S.settings.aiKey; if(d.settings)S.settings=Object.assign(S.settings,d.settings); if(keepKey)S.settings.aiKey=keepKey;
  sortCustomers(); persist();
  alert("Wiederhergestellt ✓\n\n"+nNew+" Fahrzeuge neu, "+nUpd+" aktualisiert."+(d.scans&&Object.keys(d.scans).length?"":"\n(Ohne Scan-PDFs – Kalkulationen sind vollständig.)"));
}
async function loadScan(v){if(!v||!v.colibriFile)return null; if(SCAN_CACHE[v.id])return SCAN_CACHE[v.id]; const d=await kvGet("scan_"+v.id); if(d&&d.bytes){SCAN_CACHE[v.id]=d; return d;} return null;}
function kvSet(k,val){return new Promise(res=>{try{const rq=tx("kv","readwrite").put(val,k);rq.onsuccess=()=>res();rq.onerror=()=>res();}catch(e){res();}});}
function imgSet(id,data){return new Promise(res=>{try{const rq=tx("img","readwrite").put(data,id);rq.onsuccess=()=>res();rq.onerror=()=>res();}catch(e){res();}});}
function imgDel(id){return new Promise(res=>{try{const rq=tx("img","readwrite").delete(id);rq.onsuccess=()=>res();rq.onerror=()=>res();}catch(e){res();}});}
function imgAll(){return new Promise(res=>{const out={};try{const st=tx("img","readonly");const ck=st.openCursor();ck.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};ck.onerror=()=>res(out);}catch(e){res(out);}});}

function downscale(file,max=1280,q=0.6){return new Promise(resolve=>{
  const reader=new FileReader();
  reader.onload=()=>{const img=new Image();
    img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      try{resolve(cv.toDataURL("image/jpeg",q));}catch(e){resolve(reader.result);}};
    img.onerror=()=>resolve(reader.result); img.src=reader.result;};
  reader.readAsDataURL(file);
});}

        let n=0; arr.forEach(x=>{if(x&&x.name){const had=custByName(x.name); const k=upsertCustomer(x.name,(x.email||(had&&had.email)||""),(x.adresse||(had&&had.adresse)||"")); if(k&&!had)n++;}});
        sortCustomers(); persist(); toast(n+" neue Kunden übernommen ("+arr.length+" in der Datei)."); draw();
      }catch(e){alert("Datei konnte nicht gelesen werden: "+e.message);}
    };}
  }
  draw();
}
async function exportCustomers(){

function checkInfo(v){const c=v.colibri; if(!c||c.imported==null)return null;
  const total=c.reportTotal!=null?c.reportTotal:c.rowSum; return {ok:c.imported===total&&!(c.unknown||[]).length,imported:c.imported,total,unknown:c.unknown||[]};}
function checkBadge(v){const k=checkInfo(v); if(!k)return ""; return k.ok?' · <b style="color:var(--greenDk)">Scan ✓</b>':' · <b style="color:var(--brick)">Scan prüfen ⚠</b>';}
async function importColibriFile(v,f){
  const buf=await f.arrayBuffer(); const orig=buf.slice(0);
  const pages=await colibriPages(buf); const res=parseColibri(pages);
  if(!res.found)return {ok:false};
  applyColibri(v,res);
  const scanName=(f.name&&/\.pdf$/i.test(f.name))?f.name:("Colibri-Scan_"+((v.kennzeichen||"Fahrzeug").replace(/[^A-Za-z0-9]+/g,"-"))+".pdf");
  const rec={name:scanName,bytes:orig}; await kvSet("scan_"+v.id,rec); SCAN_CACHE[v.id]=rec;
  v.colibriFile={name:scanName,size:orig.byteLength}; persist();
  const k=checkInfo(v);
  return {ok:true,n:Object.keys(res.panels).length,imported:k.imported,total:k.total,match:k.ok,unknown:k.unknown,
    big:Object.values(res.panels).reduce((a,p)=>a+(p.big||0),0)};
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){ /* files: [{name, data:Uint8Array}] – unkomprimiert */
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+sz;});
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xesc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");}
function colL(i){let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function sheetXML(COLS,rows,fmt,sumC,freezeX){
  /* fmt(ci) -> Stil-Index; sumC: Set der Spalten mit Summenformel */
  const cell=(r,ci,val,st)=>{const ref=colL(ci)+r;
    if(val===null||val===undefined||val==="")return `<c r="${ref}" s="${st||0}"/>`;
    if(typeof val==="number")return `<c r="${ref}" s="${st||0}"><v>${val}</v></c>`;
    return `<c r="${ref}" s="${st||0}" t="inlineStr"><is><t xml:space="preserve">${xesc(val)}</t></is></c>`;};
  let sd=`<row r="1" ht="32" customHeight="1">`+COLS.map((c,i)=>cell(1,i,c[0],1)).join("")+`</row>`;
  rows.forEach((r,ri)=>{const rr=ri+2; sd+=`<row r="${rr}">`+r.map((v,ci)=>cell(rr,ci,v,fmt(ci))).join("")+`</row>`;});
  const last=rows.length+1, sr=last+1;
  sd+=`<row r="${sr}">`+COLS.map((c,ci)=>{const ref=colL(ci)+sr;

<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">

      c.glassEur||null,+a.rest.toFixed(2),vStatus(v)==="reparatur"?"Reparatur":"Besichtigung",k?(k.ok?"✓":"prüfen"):"",(v.notiz||"").replace(/\s+/g," ").trim()];});
  const sh1=sheetXML(C1,rows,ci=>M1.has(ci)?2:P1.has(ci)?7:ci===9?4:0,S1,2);
  /* Blatt 2: Abrechnung je Techniker */
  const C2=[["Techniker",20],["Fahrzeuge Dellen",12],["Dellen (PDR) €",14],["De-/Remontagen",12],["De-/Remontage €",14],["Gesamt auszahlen €",16]];
  const rows2=Object.keys(pay).sort((x,y)=>x.localeCompare(y,"de")).map(n=>{const t=pay[n]; return [n,t.fz.size,+t.pdr.toFixed(2),t.nDem,+t.dem.toFixed(2),+(t.pdr+t.dem).toFixed(2)];});
  const sh2=sheetXML(C2,rows2,ci=>(ci===2||ci===4||ci===5)?2:0,new Set([1,2,3,4,5]),1);
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF16233F"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE4EEE5"/></patternFill></fill></fills>

function renderVehicle(){
  const v=active(); if(!v){S.screen="list";return render();}
  const c=computeVehicle(v,S.settings);
  const titles={basis:"Basisinformationen",erfassung:"Hagelschadenerfassung",bilder:"Bilder",bericht:"Kostenvoranschlag"};
  let body="";
  if(S.screen==="basis")body=viewBasis(v);
  else if(S.screen==="erfassung")body=viewErfassung(v,c);
  else if(S.screen==="bilder")body=viewBilder(v);
  else body=viewBericht(v,c);
  const imgCount=(v.images||[]).length;
  app().innerHTML=`<div class="hdr"><div class="top"><button class="iconbtn" id="back">‹</button><div></div></div>
    <h1>${titles[S.screen]}</h1><div class="sub">🚗 ${esc(v.kennzeichen||"—")}</div></div>
    <div class="body">${body}</div>
    <div class="tabbar">
      <button class="tab ${S.screen==="basis"?"on":""}" data-s="basis">ⓘ</button>
      <button class="tab ${S.screen==="erfassung"?"on":""}" data-s="erfassung">🚗</button>
      <button class="tab ${S.screen==="bilder"?"on":""}" data-s="bilder">🖼${imgCount>0?`<span class="bdg">${imgCount}</span>`:""}</button>
      <button class="tab ${S.screen==="bericht"?"on":""}" data-s="bericht">📄</button>
    </div>`;
  document.getElementById("back").onclick=()=>{S.screen="list";render();};
  app().querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.screen=t.dataset.s;render();});
  if(S.screen==="basis")bindBasis(v);
  else if(S.screen==="erfassung")bindErfassung(v);
  else if(S.screen==="bilder")bindBilder(v);
  else bindBericht(v,c);
}

function bindBasis(v){
  const set=(k,val)=>{v[k]=val;persist();};
  document.getElementById("f_kz").oninput=e=>set("kennzeichen",e.target.value.toUpperCase());
  document.getElementById("f_fin").oninput=e=>set("fin",e.target.value.toUpperCase());
  document.getElementById("f_modell").oninput=e=>set("modell",e.target.value);
  document.getElementById("f_kunde").onclick=()=>openCustomerPicker(v,()=>renderVehicle());
  document.getElementById("f_datum").oninput=e=>set("leistungsdatum",e.target.value);
  document.getElementById("f_satz").oninput=e=>{const n=parseFloat(String(e.target.value).replace(",","."))||0; set("stundensatz",n);
    if(vLand(v)==="ES")S.settings.satzES=n; else S.settings.stundensatz=n; persist();};
  app().querySelectorAll("[data-dem]").forEach(b=>b.onclick=()=>{v.demontage=true;v.demontageEur=+b.dataset.dem;persist();renderVehicle();});
  document.getElementById("f_notiz").oninput=e=>set("notiz",e.target.value);
  const fDem=document.getElementById("f_dem");
  if(fDem)fDem.oninput=e=>{const n=parseFloat(String(e.target.value).replace(",","."));set("demontageEur",isNaN(n)?0:n);};
  app().querySelectorAll("[data-teiler]").forEach(b=>b.onclick=()=>{v.teiler=+b.dataset.teiler;persist();renderVehicle();});
  app().querySelectorAll("[data-logo]").forEach(b=>b.onclick=()=>{
    v.logo=b.dataset.logo; S.settings.logo=v.logo; persist(); renderVehicle();});
  app().querySelectorAll("[data-land]").forEach(b=>b.onclick=()=>{
    v.land=b.dataset.land; S.settings.land=v.land; v.stundensatz=landSatz(v.land); persist(); renderVehicle();});
  const cK=document.getElementById("camKz"); if(cK)cK.onclick=()=>openOCR(v,"kz");
  const cF=document.getElementById("camFin"); if(cF)cF.onclick=()=>openOCR(v,"fin");
  const impB=document.getElementById("impBtn"), impF=document.getElementById("impFile");
  if(impB&&impF){
    impB.onclick=()=>impF.click();
    impF.onchange=async()=>{
      const f=impF.files&&impF.files[0]; if(!f)return;
      const info=document.getElementById("impInfo");
      if(info)info.textContent="Lese Scanbericht …";
      try{
        const r=await importColibriFile(v,f);
        if(!r.ok){ if(info)info.textContent="Kein auswertbarer Colibri-Bericht erkannt. Bitte das Original-PDF verwenden (kein Foto, kein Scan)."; return; }
        const es=vLand(v)==="ES";
        alert((r.match?"Colibri-Import erfolgreich ✓":"⚠ Colibri-Import – bitte prüfen")+"\n\n"+r.n+" Bauteile · "+r.imported+" Dellen übernommen"
          +(r.match?" (Bericht: "+r.total+" ✓)":"\nBericht nennt "+r.total+" Dellen!")
          +(r.unknown.length?"\nNicht erkannt: "+r.unknown.join(", "):"")
          +(r.big?"\n"+r.big+" Delle(n) > 85 mm"+(es?" – zählen als 2 Bollos.":" als Sonderposition markiert – bitte manuell bewerten."):"")
          +(es?"":"\n\nDachholm: Klebetechnik automatisch gesetzt.")+"\nAlubauteile bitte prüfen und selbst setzen.");
        renderVehicle();
      }catch(e){ if(info)info.textContent="Fehler beim Lesen: "+e.message; }
    };
  }
  app().querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{const z=b.dataset.z;const on=(v.zustand||[]).includes(z);v.zustand=on?v.zustand.filter(x=>x!==z):[...(v.zustand||[]),z];persist();renderVehicle();});
  app().querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const k=b.dataset.tg;v[k]=!v[k];persist();renderVehicle();});
  document.getElementById("weiter").onclick=()=>{S.screen="erfassung";renderVehicle();};
}

function carSVG(v){
  const on=k=>panelStats(v.panels[k]||{}).total>0;
  const fill=a=>a?"var(--green)":"#e7ebf1", stroke=a=>a?"var(--greenDk)":"var(--greyDk)", sw=a=>a?2.4:1.3;
  const label=(k,cx,cy)=>{const st=panelStats(v.panels[k]||{});const a=st.total>0;const m=PMAP[k];
    return `<text x="${cx}" y="${cy-(a?6:0)}" text-anchor="middle" font-size="12" font-weight="700" fill="${a?"#fff":"var(--navy)"}" style="pointer-events:none">${m.short}</text>`
      +(a?`<text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" style="pointer-events:none">${st.total} / ${st.avgClass}</text>`:"");};

/* ---- Bauteil-Dialog ---- */
function openPanel(v,key){
  const panel=PMAP[key];
  const data=v.panels[key]||{key};
  const d=Object.assign({dents:getDents(data),alu:false,kleber:false,method:"sanft",finish:true,awManual:false,baseAW:null,big:0,bigEur:0},data);
  d.dents=Object.assign({},getDents(data));
  const vs=vehSettings(v), ES=vLand(v)==="ES";
  function commit(){v.panels[key]=Object.assign({key},d);persist();}
  function calc(){
    const st=panelStats(d);
    const baseAuto=lookupAW(vs.teiler,panel.orient,st.total,st.avgClass);
    const base=d.awManual&&d.baseAW!=null?d.baseAW:baseAuto;
    const rep=panelRepairAW(Object.assign({},d,{baseAW:base,awManual:true}),vs.teiler);
    return {st,baseAuto,rep,euroPerAW:vs.stundensatz/vs.teiler};
  }
  const t=teilerVals(vs.teiler);
  function html(){
    const {st,baseAuto,rep,euroPerAW}=calc();

    return `<div class="dialog">
      <div class="row"><div><div style="font-size:19px;font-weight:800;text-transform:uppercase;">${esc(panel.label)}</div>

        <button class="iconbtn" id="dlgX" style="background:var(--navy);border-radius:12px;">✕</button></div>
      <div style="display:flex;margin-top:16px;background:var(--bg);border-radius:14px;padding:16px;">
        <div style="flex:1;padding-right:14px;">
          ${ES?`<div class="row" style="margin-bottom:9px;"><span class="muted">Bollos</span><b id="fBol" style="font-size:17px;">${panelBollos(d).bollos}</b></div>
          <div style="font-size:12px;color:var(--sub);line-height:1.5;">bis 30 mm = 1<br>über 30 mm = 2<br>Preis über Fahrzeug-Matrix</div>`:`<div class="row" style="margin-bottom:9px;"><span class="muted">Preis</span><b id="fPreis" style="font-size:17px;">${eur(rep*euroPerAW)}</b></div>
          <div class="row" style="margin-bottom:9px;"><span class="muted">AW</span><b id="fAw" style="font-size:17px;">${num(rep)}</b></div>
          <div class="row"><span class="muted">Stunden</span><b id="fStd" style="font-size:17px;">${num(rep/vs.teiler)}</b></div>`}
        </div>
        <div style="width:1px;background:var(--line);"></div>
        <div style="flex:1;padding-left:14px;font-size:13px;color:var(--sub);line-height:1.9;">
          <div>Dellen: <b id="sTot" style="color:var(--text)">${st.total}</b></div>
          <div>Ø Größe: <b id="sAvg" style="color:var(--text)">${num(st.avgX,1)} mm</b></div>
          <div>Klasse: <b id="sCls" style="color:var(--text)">${st.avgClass||"—"} mm</b></div>
          ${ES?"":`<div>BVAT-AW: <b id="sBvat" style="color:var(--text)">${num(baseAuto)}</b></div>`}
        </div></div>
      <div style="font-size:13px;color:var(--sub);margin:16px 0 8px;">Dellenanzahl je Größenklasse (mm)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${SIZES.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:5px 6px;">
          <span style="font-weight:700;width:30px;text-align:center;">${s}</span>
          <button class="mini decD" data-s="${s}">−</button>
          <input class="dinp" data-s="${s}" value="${d.dents[s]||0}" inputmode="numeric" style="width:34px;text-align:center;font-weight:800;border:none;outline:none;font-size:15px;"/>
          <button class="mini incD" data-s="${s}">+</button></div>`).join("")}
      </div>
      <div style="border:1px dashed var(--brick);border-radius:12px;padding:10px 12px;margin-top:14px;">
        <div style="font-weight:700;font-size:13px;">Dellen über 85 mm – Sonderposition</div>
        <div style="font-size:11px;color:var(--sub);margin-bottom:8px;">${ES?"Zählen in der Matrix als 2 Bollos.":"Nicht in der BVAT-Matrix enthalten. Betrag manuell festlegen."}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="mini" id="bigDec">−</button>
          <input id="bigN" value="${d.big||0}" inputmode="numeric" style="width:42px;text-align:center;font-weight:800;border:1px solid var(--line);border-radius:8px;padding:5px;"/>
          <button class="mini" id="bigInc">+</button>

        </div></div>

      ${d.method==="ptp"?`<div style="color:var(--brick);font-size:12px;margin-top:6px;">${ES?"Anteil dieses Bauteils am Matrixpreis (nach Bollos) wird um 40 % reduziert. Im Gutachten: „Desabollado previo a pintura“.":"Preis des Bauteils −40 %. Ohne Lack- und Lackierarbeitskosten. Im Gutachten: „Vordrücken zur Lackierung“."}</div>`:""}
      ${ES?"":`<div class="row" style="padding:10px 0;"><span style="font-size:14px;">Finish (+${num(finishAW,1)} AW)</span>
        <button class="toggle ${d.finish?"on":""}" id="bFin"><span class="knob"></span></button></div>`}
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button id="dlgDel" style="padding:15px 18px;background:#fff;color:var(--brick);border:1px solid var(--line);border-radius:14px;font-weight:700;">Entfernen</button>
        <button id="dlgSave" style="flex:1;padding:15px;background:var(--navy);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;">✓ Speichern</button>
      </div></div>`;
  }
  function refreshNums(){
    const {st,baseAuto,rep,euroPerAW}=calc();
    const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
    set("fBol",panelBollos(d).bollos);
    set("fPreis",eur(rep*euroPerAW));set("fAw",num(rep));set("fStd",num(rep/vs.teiler));
    set("sTot",st.total);set("sAvg",num(st.avgX,1)+" mm");set("sCls",(st.avgClass||"—")+" mm");set("sBvat",num(baseAuto));
  }
  function draw(){
    modal().innerHTML=`<div class="overlay" id="ov">${html()}</div>`;
    document.getElementById("ov").onclick=e=>{if(e.target.id==="ov"){commit();close();renderVehicle();}};
    document.getElementById("dlgX").onclick=()=>{commit();close();renderVehicle();};
    document.getElementById("dlgSave").onclick=()=>{commit();close();renderVehicle();};
    document.getElementById("dlgDel").onclick=()=>{d.dents={};commit();close();renderVehicle();};
    modal().querySelectorAll(".incD").forEach(b=>b.onclick=()=>{const s=+b.dataset.s;d.dents[s]=(d.dents[s]||0)+1;const i=modal().querySelector('.dinp[data-s="'+s+'"]');if(i)i.value=d.dents[s];refreshNums();});
    modal().querySelectorAll(".decD").forEach(b=>b.onclick=()=>{const s=+b.dataset.s;d.dents[s]=Math.max(0,(d.dents[s]||0)-1);const i=modal().querySelector('.dinp[data-s="'+s+'"]');if(i)i.value=d.dents[s];refreshNums();});
    modal().querySelectorAll(".dinp").forEach(i=>i.oninput=()=>{const s=+i.dataset.s;d.dents[s]=Math.max(0,parseInt(i.value)||0);refreshNums();});
    const bn=document.getElementById("bigN"), be=document.getElementById("bigE");
    document.getElementById("bigInc").onclick=()=>{d.big=(+d.big||0)+1;bn.value=d.big;refreshNums();};
    document.getElementById("bigDec").onclick=()=>{d.big=Math.max(0,(+d.big||0)-1);bn.value=d.big;refreshNums();};
    bn.oninput=()=>{d.big=Math.max(0,parseInt(bn.value)||0);refreshNums();};
    be.oninput=()=>{d.bigEur=Math.max(0,parseFloat(String(be.value).replace(",","."))||0);};

    document.getElementById("bAlu").onclick=()=>{d.alu=!d.alu;draw();};
    const bK=document.getElementById("bKle"); if(bK)bK.onclick=()=>{d.kleber=!d.kleber;draw();};

    const bFi=document.getElementById("bFin"); if(bFi)bFi.onclick=()=>{d.finish=!d.finish;draw();};
  }
  function close(){modal().innerHTML="";}
  draw();
}

function bindBilder(v){
  const cam=document.getElementById("camIn"),gal=document.getElementById("galIn");
  document.getElementById("bCam").onclick=()=>cam.click();
  document.getElementById("bGal").onclick=()=>gal.click();

    const url=await downscale(f);const id=uid();await imgSet(id,url);S.images[id]=url;v.images=[...(v.images||[]),{id,label:"Foto"}];persist();}renderVehicle();};
  cam.onchange=e=>{add(e.target.files);e.target.value="";};
  gal.onchange=e=>{add(e.target.files);e.target.value="";};
  app().querySelectorAll(".delImg").forEach(b=>b.onclick=async()=>{const id=b.dataset.id;await imgDel(id);delete S.images[id];v.images=(v.images||[]).filter(im=>im.id!==id);persist();renderVehicle();});
  app().querySelectorAll(".labSel").forEach(sel=>sel.onchange=()=>{const id=sel.dataset.id;v.images=(v.images||[]).map(im=>im.id===id?Object.assign({},im,{label:sel.value}):im);persist();});
}

/* ---- Gutachten ---- */
function viewBericht(v,c){
  if(c.es)return viewBerichtES(v,c);
  return viewBerichtDE(v,c);
}
function esLines(v,c){ /* gemeinsame Zeilen für ES-KVA (App, PDF, Text) */
  const e=c.es, L=[];
  L.push({l:"Reparación PDR · categoría "+e.cat[0]+" ("+esRange(e.cat)+" bollos) · "+h1(e.H.h)+" × "+eur(e.rate)+"/h",v:e.matrixEur});
  e.adj.forEach(x=>L.push({l:x.es+" ("+(x.h>0?"+":"−")+hA(Math.abs(x.h))+")",v:x.h*e.rate}));
  if(c.demEur>0)L.push({l:"Desmontaje y montaje",v:c.demEur});
  c.glass.forEach(g=>L.push({l:g.es,v:g.eur,open:!(g.eur>0)}));
  return L;
}
function viewBerichtES(v,c){
  const e=c.es, X=TX(v);

    <td style="text-align:center">${p.total+(+p.big||0)}</td><td style="text-align:center">${p.avgClass}</td><td style="text-align:center">${p.bollos}</td></tr>`).join("");

      <div style="font-size:12px;color:var(--sub);margin-top:4px;">${esFormula(e,"es")} · tope ${eur(e.cap)}</div></div>
    <table><thead><tr><th>${X.bauteil}</th><th>${X.dellen}</th><th>Ø mm</th><th>Bollos</th></tr></thead><tbody>${rows}
      <tr style="font-weight:700;background:#eef1f5;"><td>Total</td><td style="text-align:center">${c.dents}</td><td style="text-align:center">${c.avg}</td><td style="text-align:center">${e.bollos}</td></tr></tbody></table>
    <div style="margin-top:16px;background:var(--bg);border-radius:14px;padding:14px 16px;font-size:14px;">

}

    <td style="text-align:center">${p.total}</td><td style="text-align:center">${p.avgClass}</td><td style="text-align:center">${num(p.repair)}</td><td style="text-align:center">${eur(p.repair*c.euroPerAW)}</td></tr>`).join("");
  let imgs="";

    (v.images||[]).map(im=>S.images[im.id]?`<div style="border-radius:10px;overflow:hidden;border:1px solid var(--line);"><img src="${S.images[im.id]}" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;"/><div style="font-size:10px;color:var(--sub);padding:3px 4px;text-align:center;">${esc(im.label)}</div></div>`:"").join("")+`</div></div>`;}

    <div style="font-size:12px;color:var(--sub);margin:10px 2px;">${X.kz}: <b style="color:var(--text)">${esc(v.kennzeichen||"—")}</b> · ${X.fin}: ${esc(v.fin||"—")}${v.modell?" · "+X.modell+": "+esc(v.modell):""}<br>
      ${X.datum}: ${fmtDate(v.leistungsdatum)} · ${X.zustand}: ${esc(zustStr(v))}</div>
    <div style="background:var(--greenBg);border:1px solid var(--greenDk);border-radius:14px;padding:14px 16px;margin:10px 0;">
      <div style="font-size:13px;color:var(--greenDk);font-weight:700;">${X.reinLang}</div>
      <div class="row" style="align-items:baseline;margin-top:4px;"><span style="font-size:28px;font-weight:800;color:var(--greenDk);">${num(c.repairAW)} ${X.aw}</span><span style="font-size:18px;font-weight:700;">${eur(c.repairEur)}</span></div></div>
    <h3 style="text-align:center;margin:10px 0;">${X.scan}</h3>
    <table><thead><tr><th>${X.bauteil}</th><th>${X.dellen}</th><th>Ø mm</th><th>${X.aw}</th><th>€</th></tr></thead><tbody>
      ${rows}
      <tr style="font-weight:700;background:#eef1f5;"><td>${X.summe}</td><td style="text-align:center">${c.dents}</td><td style="text-align:center">${c.avg}</td><td style="text-align:center">${num(c.repairAW)}</td><td style="text-align:center">${eur(c.repairEur)}</td></tr>
      ${c.bigCount>0?`<tr style="color:var(--brick);font-weight:700;"><td>${X.sonder}</td><td style="text-align:center">${c.bigCount}</td><td style="text-align:center">&gt;85</td><td style="text-align:center">—</td><td style="text-align:center">${c.bigEur>0?eur(c.bigEur):"manuell"}</td></tr>`:""}
      ${c.finishAW>0?neben(X.finish,c.finishAW):""}${c.ruestAW>0?neben(X.ruest,c.ruestAW):""}${c.greifAW>0?neben(X.greif,c.greifAW):""}${c.hohlAW>0?neben(X.hohl,c.hohlAW):""}${c.verbrAW>0?neben(X.verbr,c.verbrAW):""}
      <tr style="background:var(--navy);color:#fff;font-weight:800;"><td>${X.gesamt}</td><td style="text-align:center">${c.dents}</td><td style="text-align:center">${c.avg}</td><td style="text-align:center">${num(c.totalAW)}</td><td style="text-align:center">${eur(c.awNetto)}</td></tr>
    </tbody></table>
    <div style="margin-top:16px;background:var(--bg);border-radius:14px;padding:14px 16px;">
      <div class="row"><span>${X.awnetto}</span><span>${eur(c.awNetto)}</span></div>
      ${c.bigEur>0?`<div class="row"><span>${X.sonder}</span><span>${eur(c.bigEur)}</span></div>`:""}
      ${(c.kleberMat+c.hohlMat)>0?`<div class="row"><span>${X.material}</span><span>${eur(c.kleberMat+c.hohlMat)}</span></div>`:""}
      ${c.demEur>0?`<div class="row"><span>${X.demont}</span><span>${eur(c.demEur)}</span></div>`:""}
      ${c.glass.map(g=>`<div class="row"><span>${g.de}</span><span>${g.eur>0?eur(g.eur):"separat"}</span></div>`).join("")}
      <div class="row" style="font-weight:800;"><span>${X.netto}</span><span>${eur(c.netto)}</span></div>
      <div class="row"><span>${X.mwst}</span><span>${eur(c.brutto-c.netto)}</span></div>
      <div style="height:1px;background:var(--line);margin:8px 0;"></div>
      <div class="row" style="font-size:20px;font-weight:800;color:var(--greenDk);"><span>${X.brutto}</span><span>${eur(c.brutto)}</span></div>
    </div>
    ${sharesBox(v,c)}
    ${(v.notiz||"").trim()?`<div style="margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;">
      <div style="font-weight:700;margin-bottom:4px;">${X.notiz}</div>
      <div style="white-space:pre-wrap;font-size:14px;color:var(--text);">${esc(v.notiz)}</div></div>`:""}
    ${imgs}
    <button class="pbtn" id="mailBtn" style="background:var(--greenDk);">✉️ Per E-Mail senden${v.kundeEmail?`<span style="display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:2px;">an ${esc(v.kundeEmail)}</span>`:""}${v.colibriFile?`<span style="display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:2px;">📎 KVA + Colibri-Scan in einer PDF</span>`:""}</button>
    <button class="pbtn" id="pdfBtn" style="background:#fff;color:var(--navy);border:1px solid var(--navy);">📄 PDF speichern / teilen</button>
    <button class="pbtn" id="statBtn" style="background:#fff;color:var(--greenDk);border:1px solid var(--greenDk);">${vStatus(v)==="reparatur"?"↩ Zurück in Besichtigung":"🔧 In Reparatur verschieben"}</button>
    <button class="pbtn" id="copyBtn" style="background:#fff;color:var(--navy);border:1px solid var(--navy);">📋 Als Text kopieren</button>
  </div>`;
}
function bindBericht(v,c){
  document.getElementById("pdfBtn").onclick=()=>sharePDF(v,c);
  document.getElementById("mailBtn").onclick=()=>mailPDF(v,c);
  prepSendPDF(v,c);
  bindShares(v,()=>{const y=window.scrollY; renderVehicle(); window.scrollTo(0,y);});
  document.getElementById("statBtn").onclick=()=>{const to=vStatus(v)==="reparatur"?"besichtigung":"reparatur"; v.status=to; if(to==="reparatur")v.repAt=new Date().toISOString(); else delete v.repAt; persist(); toast(to==="reparatur"?"🔧 In Reparatur verschoben":"↩ Zurück in Besichtigung",2500); renderVehicle();}; // KVA + Scan vorab zu einer PDF zusammenführen, damit das Teilen-Menü sofort aufgeht
  document.getElementById("copyBtn").onclick=()=>{
    const X=TX(v);
    if(c.es){const e=c.es;
      const L=[X.kva.toUpperCase(),X.kunde+": "+v.kunde+"   "+X.kz+": "+v.kennzeichen+"   "+X.fin+": "+(v.fin||"-")+(v.modell?"   "+X.modell+": "+v.modell:""),X.datum+": "+fmtDateL(v,v.leistungsdatum),""]
        .concat(c.panels.filter(p=>p.total>0||p.big>0).map(p=>plabel(v,p.key)+": "+(p.total+(+p.big||0))+" abolladuras = "+p.bollos+" bollos"+(dentBreak(p)?"  ["+dentBreak(p)+"]":"")))
        .concat(["","Total: "+e.bollos+" bollos ("+e.small+" + "+e.large+" × 2) → categoría "+e.cat[0]])
        .concat(esLines(v,c).map(x=>x.l+": "+(x.open?"aparte":eur(x.v))))
        .concat([X.netto+" "+eur(c.netto)+"   "+X.mwst+" "+eur(c.brutto-c.netto)+"   "+X.brutto+" "+eur(c.brutto)]);
      if((v.notiz||"").trim())L.push("",X.notiz+": "+v.notiz);
      const t=L.join("\n"); if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert("Presupuesto kopiert."),()=>alert(t)); else alert(t); return;}
    const lines=[X.kva.toUpperCase(),X.kunde+": "+v.kunde+"   "+X.kz+": "+v.kennzeichen+"   "+X.fin+": "+(v.fin||"-")+(v.modell?"   "+X.modell+": "+v.modell:""),
      X.datum+": "+fmtDateL(v,v.leistungsdatum)+"   "+X.zustand+": "+zustStr(v),""]
      .concat(c.panels.filter(p=>p.total>0).map(p=>plabel(v,p.key)+": "+p.total+"x Ø"+p.avgClass+"mm = "+num(p.repair)+" "+X.aw+" = "+eur(p.repair*c.euroPerAW)+(dentBreak(p)?"  ["+dentBreak(p)+"]":"")))
      .concat(c.bigCount>0?[X.sonder+": "+c.bigCount+(c.bigEur>0?" = "+eur(c.bigEur):" ("+X.manuell+")")]:[])
      .concat(["",X.rein+": "+num(c.repairAW)+" "+X.aw+" = "+eur(c.repairEur),
        X.gesamt+": "+num(c.totalAW)+" "+X.aw]).concat(c.demEur>0?[X.demont+": "+eur(c.demEur)]:[]).concat(c.glass.map(g=>g.de+": "+(g.eur>0?eur(g.eur):"separat"))).concat([X.netto+" "+eur(c.netto)+"   "+X.mwst+"   "+X.brutto+" "+eur(c.brutto)]);
    if((v.notiz||"").trim())lines.push("",X.notiz+": "+v.notiz);
    const txt=lines.join("\n");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>alert("Kostenvoranschlag kopiert."),()=>alert(txt));
    else alert(txt);
  };
}

/* ---- Einstellungen ---- */
function openSettings(){
  function draw(){
    const e=S.settings.stundensatz/S.settings.teiler;
    modal().innerHTML=`<div class="overlay center" id="ovS"><div class="modalbox">
      <div class="row"><h2 style="margin:0;font-size:18px;">Standardwerte</h2><span id="sX" style="color:var(--sub);font-size:22px;">✕</span></div>
      <div style="font-size:12px;color:var(--sub);margin-top:6px;">Vorgabe für <b>neue</b> Fahrzeuge. Pro Fahrzeug änderst du Teiler & Satz direkt in der Fahrzeug-Maske.</div>
      <div style="margin-top:16px;"><label class="muted" style="font-size:14px;">🇩🇪 Stundenverrechnungssatz BVAT (€)</label>
        <input id="setSatz" type="number" class="inp" style="margin-top:6px;" value="${S.settings.stundensatz}"/></div>
      <div style="margin-top:12px;"><label class="muted" style="font-size:14px;">🇪🇸 Stundensatz Matriz España (€/h)</label>
        <input id="setSatzES" type="number" class="inp" style="margin-top:6px;" value="${landSatz("ES")}"/></div>
      <div style="margin-top:16px;"><label class="muted" style="font-size:14px;">Teiler</label>
        <div style="display:flex;gap:8px;margin-top:6px;">
          <button class="seg ${S.settings.teiler===10?"on":""}" data-t="10">10er-Teiler</button>
          <button class="seg ${S.settings.teiler===12?"on":""}" data-t="12">12er-Teiler</button></div></div>
      <div style="margin-top:18px;background:var(--greenBg);border-radius:12px;padding:12px 14px;color:var(--greenDk);font-weight:700;">Daraus: ${eur(e)} pro AW</div>
      <button class="seg" id="setKunden" style="width:100%;margin-top:16px;border-color:var(--navy);color:var(--navy);">👥 Kunden verwalten (${S.customers.length})</button>
      <div style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px;">
        <label class="muted" style="font-size:14px;font-weight:700;">Datensicherung (${S.vehicles.length} Fahrzeuge)</label>
        <div style="font-size:11px;color:var(--sub);margin:4px 0 8px;">Letzte Sicherung: ${S.settings.lastBackup?new Date(S.settings.lastBackup).toLocaleString("de-DE"):"noch nie"}. Datei z. B. in „Dateien“ / iCloud ablegen.</div>
        <button class="seg" id="bkSave" style="width:100%;border-color:var(--navy);color:var(--navy);">💾 Sichern (Kalkulationen + Fotos)</button>
        <button class="seg" id="bkSaveAll" style="width:100%;margin-top:8px;">💾 Sichern inkl. Scan-PDFs (größer)</button>
        <button class="seg" id="bkLoad" style="width:100%;margin-top:8px;">📂 Sicherung wiederherstellen</button>
        <input type="file" id="bkFile" accept="application/json,.json" style="display:none"/>
      </div>
      <div style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px;">
        <label class="muted" style="font-size:14px;font-weight:700;">KI-Texterkennung (FIN & Kennzeichen per Foto)</label>
        <input id="setKey" class="inp" style="margin-top:6px;" type="password" autocomplete="off"
          placeholder="sk-ant-..." value="${esc(S.settings.aiKey||"")}"/>
        <div style="font-size:11px;color:var(--sub);margin-top:6px;">Schl\u00fcssel von console.anthropic.com. Bleibt nur auf diesem Ger\u00e4t.</div>
        <input id="setModel" class="inp" style="margin-top:8px;" placeholder="${AI_MODEL_DEF}" value="${esc(S.settings.aiModel||"")}"/>
        <button class="seg" id="setTest" style="width:100%;margin-top:8px;">Verbindung testen</button>
        <div id="setTestOut" style="font-size:12px;margin-top:6px;color:var(--sub);"></div>
      </div>
      <button class="pbtn" id="setDone">Fertig</button>
      <div style="text-align:center;font-size:11px;color:var(--sub);margin-top:10px;">App-Version ${APP_VERSION}</div></div></div>`;
    document.getElementById("ovS").onclick=ev=>{if(ev.target.id==="ovS")close();};
    document.getElementById("sX").onclick=close;
    document.getElementById("setDone").onclick=close;
    document.getElementById("setKunden").onclick=()=>openCustomerPicker(null,()=>draw());
    document.getElementById("bkSave").onclick=()=>exportBackup(false);
    document.getElementById("bkSaveAll").onclick=()=>exportBackup(true);
    const bkF=document.getElementById("bkFile");
    document.getElementById("bkLoad").onclick=()=>bkF.click();
    bkF.onchange=async()=>{const f=bkF.files&&bkF.files[0]; bkF.value=""; if(f){await importBackup(f); draw();}};
    document.getElementById("setSatz").oninput=ev=>{S.settings.stundensatz=parseFloat(ev.target.value)||0;persist();};
    document.getElementById("setSatzES").oninput=ev=>{S.settings.satzES=parseFloat(String(ev.target.value).replace(",","."))||0;persist();};
    modal().querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.settings.teiler=+b.dataset.t;persist();draw();});
    document.getElementById("setKey").oninput=ev=>{S.settings.aiKey=ev.target.value.trim();persist();};
    document.getElementById("setModel").oninput=ev=>{S.settings.aiModel=ev.target.value.trim();persist();};
    document.getElementById("setTest").onclick=async()=>{
      const out=document.getElementById("setTestOut");
      const key=(S.settings.aiKey||"").trim();
      if(!key){out.textContent="Kein Schl\u00fcssel eingetragen.";return;}
      out.textContent="Teste \u2026";
      try{
        const r=await fetch(AI_URL,{method:"POST",
          headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json",
            "anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:(S.settings.aiModel||AI_MODEL_DEF),max_tokens:16,
            messages:[{role:"user",content:"Antworte nur mit: OK"}]})});
        const j=await r.json();
        if(j.error){out.style.color="var(--brick)";out.textContent="Fehler: "+(j.error.message||"unbekannt");}
        else{out.style.color="var(--greenDk)";out.textContent="Verbindung steht \u2713 Modell: "+(j.model||"?");}
      }catch(e){out.style.color="var(--brick)";out.textContent="Keine Verbindung: "+e.message;}
    };
  }
  function close(){modal().innerHTML="";render();}
  draw();
}

/* ===== Start ===== */
(async function init(){
  try{
    await openDB();
    const vs=await kvGet("vehicles"); if(Array.isArray(vs))S.vehicles=vs;
    const se=await kvGet("settings"); if(se)S.settings=Object.assign(S.settings,se);
    S.images=await imgAll();
    const ks=await kvGet("customers"); if(Array.isArray(ks))S.customers=ks;
    // Bisher eingetippte Kunden aus vorhandenen Kalkulationen einmalig übernehmen
    S.vehicles.forEach(v=>{if(normName(v.kunde)){const k=upsertCustomer(v.kunde,null,null); if(k&&!k.lastUsed)k.lastUsed=v.createdAt||1;}});
    if(!custByName("Allianz"))upsertCustomer("Allianz","","");
    sortCustomers(); kvSet("customers",S.customers);
  }catch(e){console.warn("Speicher nicht verfügbar:",e);}
  render();
  try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
  try{ const lv=localStorage.getItem("hes_ver"); if(lv&&lv!==APP_VERSION)toast("✓ App aktualisiert auf "+APP_VERSION+" – alle Daten sind erhalten.",5000); localStorage.setItem("hes_ver",APP_VERSION); }catch(e){}
  if("serviceWorker" in navigator){ try{
    const hadCtl=!!navigator.serviceWorker.controller; let reloading=false;
    const doReload=()=>{ if(reloading)return; reloading=true; location.reload(); };
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(!hadCtl)return;
      if(S.screen==="list"&&!modal().innerHTML)doReload(); else window.__updPending=true;
    });
    const reg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
    const chk=()=>{try{reg.update();}catch(e){}};
    chk(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible")chk(); });
  }catch(e){} }
})();
</script>
